[tool.poetry]
name = "mtp-lab8-variant7"
version = "1.0.0"
description = "Lab 8: logging, properties, pytest, asyncio and FastAPI"
authors = ["Ким Максим Сергеевич <forgithub17569@gmail.com>"]
packages = [{ include = "lab8" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"
flake8 = ">=7.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
